name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Fix base href for Pages
        run: |
          index=$(find www -name index.html | head -1)
          sed -i 's|<base href="/">|<base href="/redview-git/">|' "$index"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Detect Pages output path
        id: pages-path
        run: |
          if [ -f www/index.html ]; then echo "path=www" >> $GITHUB_OUTPUT
          elif [ -f www/browser/index.html ]; then echo "path=www/browser" >> $GITHUB_OUTPUT
          else echo "path=www" >> $GITHUB_OUTPUT; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.pages-path.outputs.path }}

      - name: Deploy to Pages
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4
