<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>red-gaze — Icon Preview</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f0f0f0;font-family:system-ui,sans-serif;gap:48px;padding:40px}
  .section h2{color:#616161;font-weight:500;font-size:14px;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;text-align:center}
  .grid{display:flex;gap:40px;flex-wrap:wrap;justify-content:center}
  .card{background:white;border-radius:24px;padding:60px;box-shadow:0 8px 32px rgba(0,0,0,.12);text-align:center}
  .icon-wrap{width:192px;height:192px;border-radius:40px;overflow:hidden;margin:0 auto;position:relative}
  .icon-bg{position:absolute;inset:0;}
  .icon-window{width:192px;height:192px;display:flex;align-items:center;justify-content:center}
  svg{width:144px;height:144px;display:block}
  .label{margin-top:16px;font-size:13px;color:#9e9e9e}
  .label span{display:block;font-size:11px;color:#bdbdbd;margin-top:4px}
  .tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.5px;margin-bottom:16px}

  .current .icon-wrap{background:white;box-shadow:inset 0 0 0 2px #eee}
  .v1{background:#1a1a1a}

  .v2{background:linear-gradient(135deg,#7f1d1d,#b91c1c)}
</style>
</head>
<body>

<div class="section">
  <h2>Current Icon</h2>
  <div class="grid">
    <div class="card current">
      <div class="icon-wrap">
        <div class="icon-bg" style="background:white"></div>
        <div class="icon-window">
          <svg viewBox="0 0 108 108">
            <g transform="translate(14,20)">
              <path fill="#FFFFFF" d="M40,34 C28,34 17,42 11,50 C6,56 6,58 11,64 C17,72 28,80 40,80 C52,80 63,72 69,64 C74,58 74,56 69,50 C63,42 52,34 40,34 Z" stroke="#D32F2F" stroke-width="1"/>
              <path fill="#D32F2F" d="M40,44 C34,44 30,48 30,54 C30,60 34,64 40,64 C46,64 50,60 50,54 C50,48 46,44 40,44 Z"/>
              <path fill="#FFFFFF" d="M40,48 C36,48 34,50 34,54 C34,56 35,58 37,59 C37,57 38,56 40,56 C42,56 43,57 43,59 C45,58 46,56 46,54 C46,50 44,48 40,48 Z"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="label">red-gaze<span>White bg, simple eye</span></div>
    </div>
  </div>
</div>

<div class="section">
  <h2>V1 — Dark Minimal Eye</h2>
  <div class="grid">
    <div class="card">
      <div class="icon-wrap">
        <div class="icon-bg v1"></div>
        <div class="icon-window">
          <svg viewBox="0 0 108 108">
            <g transform="translate(0,0)">
              <path fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M54,30 C36,30 20,42 12,54 C8,60 8,60 12,66 C20,78 36,90 54,90 C72,90 88,78 96,66 C100,60 100,60 96,54 C88,42 72,30 54,30 Z"/>
              <circle cx="54" cy="60" r="18" fill="#ef4444"/>
              <circle cx="54" cy="60" r="10" fill="#b91c1c"/>
              <circle cx="54" cy="60" r="5" fill="#1a1a1a"/>
              <circle cx="48" cy="56" r="3" fill="rgba(255,255,255,.4)"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="label">Dark bg, layered iris, subtle highlight</div>
    </div>
  </div>
</div>

<div class="section">
  <h2>V2 — Red Gradient Eye</h2>
  <div class="grid">
    <div class="card">
      <div class="icon-wrap">
        <div class="icon-bg v2"></div>
        <div class="icon-window">
          <svg viewBox="0 0 108 108">
            <g transform="translate(0,0)">
              <path fill="none" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M54,28 C33,28 16,42 8,54 C4,60 4,60 8,66 C16,78 33,92 54,92 C75,92 92,78 100,66 C104,60 104,60 100,54 C92,42 75,28 54,28 Z"/>
              <circle cx="54" cy="60" r="20" fill="#ef4444"/>
              <circle cx="54" cy="60" r="12" fill="rgba(255,255,255,.15)"/>
              <circle cx="54" cy="60" r="6" fill="#7f1d1d"/>
              <circle cx="49" cy="55" r="3.5" fill="rgba(255,255,255,.35)"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="label">Brand gradient bg, translucent inner rings</div>
    </div>
  </div>
</div>

</body>
</html>
