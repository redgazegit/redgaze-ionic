<div class="video-card" [class.stories-mode]="storiesMode()" [attr.data-testid]="'video-player-' + gif().id">
  <div class="player-container">
    <video
      #videoPlayer
      [attr.src]="videoSrc() || null"
      attr.poster="{{posterSrc()}}"
      playsinline
      muted
      [attr.preload]="preloadStrategy()"
      [class.plyr]="!storiesMode()"
    ></video>
    @if (!storiesMode() && !sourceReady()) {
      <div class="video-placeholder">
        @if (posterSrc()) {
          <img [src]="posterSrc()" class="placeholder-img" alt="" />
        } @else {
          <div class="skeleton"></div>
        }
        <div class="vp-pulse"></div>
      </div>
    }
  </div>
  @if (!storiesMode()) {
    <div class="video-info">
      <div class="info-left">
        @if (gif().userName) {
          <span class="username-label" data-testid="vp-username" (click)="goToCreator($event)">@{{ gif().userName }}</span>
        }
      </div>
      <div class="info-right">
        <ion-button data-testid="vp-fav-btn" fill="clear" size="small" (click)="toggleFav()">
          <ion-icon [name]="isFav() ? 'heart' : 'heart-outline'"></ion-icon>
        </ion-button>
        <ion-button data-testid="vp-download-btn" fill="clear" size="small" (click)="download()">
          <ion-icon name="download-outline"></ion-icon>
        </ion-button>
      </div>
    </div>
  }
</div>
